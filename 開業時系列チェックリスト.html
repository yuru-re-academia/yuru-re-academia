                    { id: "t7-1", tag: "標準", target: "施工業者 / 自社", text: "内装施工の完成・引き渡し・竣工検査（バリアフリーチェック）", detail: "手すり高さ、ドア開口幅、床段差ゼロ確認、看板設置。" },
                    { id: "t7-2", tag: "標準", target: "ディーラー / 保険", text: "送迎車両（軽ワゴン1台）の納車・任意保険手続き完了", detail: "全スタッフが運転できるよう対人・対物無制限保険加入。" }
                ]
            },

            // PHASE 04: 営業 & 開業期 (2027.8 - 10)
            {
                phase: "p4",
                phaseTitle: "Phase 04：営業 ＆ 開業期（2027.8 〜 2027.10）",
                phaseColor: "emerald",
                month: "2027年 8月",
                title: "現地検査 ＆ 事業者指定取得",
                tasks: [
                    { id: "t8-1", tag: "最優先・期日厳守", target: "米子市長寿社会課", text: "米子市担当官による「現地立ち入り確認検査」の受検", detail: "図面通りの設備配置、鍵付き書類庫、消毒液、非常口を現地確認。" },
                    { id: "t8-2", tag: "最優先", target: "米子市", text: "「介護事業者指定通知書（介護事業所番号）」の受領", detail: "指定番号確定後、パンフレットや名刺に事業者番号を印字。" }
                ]
            },
            {
                phase: "p4",
                phaseTitle: "Phase 04：営業 ＆ 開業期（2027.8 〜 2027.10）",
                phaseColor: "emerald",
                month: "2027年 9月",
                title: "ケアマネ営業 ＆ 共同プレ内覧会",
                tasks: [
                    { id: "t9b-1", tag: "最優先", target: "居宅 / 地域包括", text: "米子市内居宅介護支援事業所・地域包括への挨拶回り（ケアマネ営業）", detail: "「大人の学び舎・リカレント教育×身体調律」の差別化チラシを持参し体験利用を促進。" },
                    { id: "t9b-2", tag: "最優先", target: "Chukai / 地域住民", text: "Chukai共同プレ内覧会・無料健康体験イベントの開催", detail: "体験送迎・機能訓練体験・ダンス体験を実施し、初期見込み客を獲得。" },
                    { id: "t9b-3", tag: "厳守", target: "利用契約者", text: "初期オープン利用者のアセスメント・契約・通所介護計画書の作成", detail: "10月1日スタート時の初期目標利用枠（1日4〜6名以上）を確定させる。" }
                ]
            },
            {
                phase: "p4",
                phaseTitle: "Phase 04：営業 ＆ 開業期（2027.8 〜 2027.10）",
                phaseColor: "emerald",
                month: "2027年 10月 1日",
                title: "★ 2027年10月1日 GRAND OPEN",
                tasks: [
                    { id: "t10b-1", tag: "最優先", target: "自社サービス", text: "「シニアアカデミア YURU-RE:（ユルリ）」提供開始・安全運行", detail: "送迎ルートの確認、午前提供、バイタルチェック、安全第一でスタート。" },
                    { id: "t10b-2", tag: "目標達成", target: "経営ターゲット", text: "開業3ヶ月以内（12月まで）に登録16名（1日6名 / BEP達成）の確立", detail: "ケアマネへの月次実績報告、機能改善の「成果」をタイムリーに報告。" }
                ]
            }
        ];

        let completedTasks = JSON.parse(localStorage.getItem('yurugura_tasks_state') || '{}');
        let currentFilter = 'all';

        function saveState() {
            localStorage.setItem('yurugura_tasks_state', JSON.stringify(completedTasks));
            updateDashboard();
        }

        function resetData() {
            if (confirm('すべてのチェック状況をリセットして初期状態に戻しますか？')) {
                completedTasks = {};
                saveState();
                renderTasks();
            }
        }

        function toggleTask(id) {
            completedTasks[id] = !completedTasks[id];
            saveState();
            
            // Toggle visual styling immediately
            const card = document.getElementById(`card-${id}`);
            if (card) {
                if (completedTasks[id]) {
                    card.classList.add('bg-slate-50', 'opacity-75');
                } else {
                    card.classList.remove('bg-slate-50', 'opacity-75');
                }
            }
            if (document.getElementById('toggle-completed').checked) {
                renderTasks();
            }
        }

        function filterPhase(phase) {
            currentFilter = phase;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-white', 'active');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            event.target.classList.remove('bg-white', 'text-slate-600');
            event.target.classList.add('bg-slate-800', 'text-white', 'active');
            renderTasks();
        }

        function updateDashboard() {
            let total = 0;
            let completed = 0;
            let phaseCounts = { p1: { t: 0, c: 0 }, p2: { t: 0, c: 0 }, p3: { t: 0, c: 0 }, p4: { t: 0, c: 0 } };

            tasksData.forEach(section => {
                section.tasks.forEach(task => {
                    total++;
                    phaseCounts[section.phase].t++;
                    if (completedTasks[task.id]) {
                        completed++;
                        phaseCounts[section.phase].c++;
                    }
                });
            });

            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('completed-count').innerText = completed;
            document.getElementById('total-count').innerText = `/ ${total} タスク完了`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar-fill').style.width = `${percent}%`;

            // Update Phase Status Pills
            for (let i = 1; i <= 4; i++) {
                const key = `p${i}`;
                document.getElementById(`phase${i}-ratio`).innerText = `${phaseCounts[key].c}/${phaseCounts[key].t}`;
            }
        }

        function getTagStyle(tag) {
            if (tag.includes("最優先") || tag.includes("期日厳守")) {
                return "bg-rose-100 text-rose-700 border-rose-200 font-bold";
            } else if (tag.includes("厳守")) {
                return "bg-amber-100 text-amber-800 border-amber-200 font-semibold";
            } else if (tag.includes("目標達成")) {
                return "bg-emerald-100 text-emerald-800 border-emerald-200 font-bold";
            }
            return "bg-slate-100 text-slate-600 border-slate-200";
        }

        function getPhaseColorBorder(color) {
            switch(color) {
                case 'blue': return 'border-l-blue-600';
                case 'indigo': return 'border-l-indigo-600';
                case 'amber': return 'border-l-amber-600';
                case 'emerald': return 'border-l-emerald-600';
                default: return 'border-l-slate-600';
            }
        }

        function renderTasks() {
            const container = document.getElementById('checklist-container');
            const hideCompleted = document.getElementById('toggle-completed').checked;
            container.innerHTML = '';

            let filteredSections = tasksData;
            if (currentFilter !== 'all') {
                filteredSections = tasksData.filter(s => s.phase === currentFilter);
            }

            filteredSections.forEach(section => {
                const visibleTasks = section.tasks.filter(t => !hideCompleted || !completedTasks[t.id]);
                if (visibleTasks.length === 0) return;

                const sectionEl = document.createElement('div');
                sectionEl.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden card-shadow";

                let monthHeaderBg = "bg-slate-800 text-white";
                if (section.phase === "p1") monthHeaderBg = "bg-blue-900 text-white";
                if (section.phase === "p2") monthHeaderBg = "bg-indigo-900 text-white";
                if (section.phase === "p3") monthHeaderBg = "bg-amber-900 text-white";
                if (section.phase === "p4") monthHeaderBg = "bg-emerald-900 text-white";

                sectionEl.innerHTML = `
                    <div class="${monthHeaderBg} px-5 py-3 flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded bg-white/20 uppercase tracking-wider">${section.month}</span>
                            <h3 class="text-base font-bold">${section.title}</h3>
                        </div>
                        <span class="text-xs opacity-80">${section.phaseTitle}</span>
                    </div>
                    <div class="p-4 sm:p-5 space-y-3">
                        ${visibleTasks.map(task => {
                            const isDone = completedTasks[task.id] || false;
                            return `
                                <div id="card-${task.id}" class="p-3.5 rounded-lg border border-slate-200 border-l-4 ${getPhaseColorBorder(section.phaseColor)} ${isDone ? 'bg-slate-50 opacity-75' : 'bg-white hover:border-slate-300'} transition shadow-2xs">
                                    <div class="flex items-start gap-3">
                                        <div class="pt-0.5">
                                            <input type="checkbox" id="chk-${task.id}" ${isDone ? 'checked' : ''} onchange="toggleTask('${task.id}')" class="w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                                <span class="text-[10px] px-2 py-0.5 rounded border ${getTagStyle(task.tag)}">${task.tag}</span>
                                                <span class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-building-user text-slate-400 mr-1"></i> ${task.target}</span>
                                            </div>
                                            <label for="chk-${task.id}" class="text-sm font-bold text-slate-800 cursor-pointer ${isDone ? 'line-through text-slate-500' : ''}">
                                                ${task.text}
                                            </label>
                                            <p class="text-xs text-slate-500 mt-1.5 bg-slate-50 p-2 rounded border border-slate-100 details-content">
                                                <i class="fa-solid fa-circle-info text-blue-500 mr-1"></i> ${task.detail}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(sectionEl);
            });

            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl p-12 text-center border border-slate-200">
                        <i class="fa-solid fa-circle-check text-4xl text-emerald-500 mb-3"></i>
                        <h3 class="text-base font-bold text-slate-700">条件に該当する未完了タスクはありません</h3>
                        <p class="text-xs text-slate-500 mt-1">選択中のフィルターですべてのタスクが完了しているか、表示条件を変更してください。</p>
                    </div>
                `;
            }
        }

        // Initial Load Execution
        document.addEventListener('DOMContentLoaded', () => {
            renderTasks();
            updateDashboard();
        });
    </script>
</body>
</html>
